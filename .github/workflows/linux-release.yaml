name: Build Linux Release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/linux-release.yaml
      - packaging/linux/**
      - packaging/pyinstaller/lumisync_onedir.spec
      - tools/build_linux.sh
      - tools/smoke_test_appimage.sh
      - pyproject.toml
      - uv.lock
  release:
    types: [published]

permissions:
  contents: read

jobs:
  linux-appimage:
    # Build on the oldest supported Ubuntu so the AppImage's glibc is broadly
    # compatible.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install system libraries
        run: |
          sudo apt-get update
          # PyInstaller can only bundle Qt's X11 dependencies if they are
          # installed on the build host. Offscreen unit tests do not load xcb.
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfuse2 libpulse0 \
            libxkbcommon-x11-0 libx11-xcb1 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render0 \
            libxcb-render-util0 libxcb-shape0 libxcb-shm0 libxcb-sync1 \
            libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1

      - name: Build AppImage
        run: |
          chmod +x tools/build_linux.sh
          RUN_TESTS=1 tools/build_linux.sh

      - name: Test AppImage startup on a clean X11 runtime
        timeout-minutes: 5
        run: |
          # Keep build-host Qt dependencies out of the runtime: otherwise
          # installed system libraries can hide an incomplete AppImage.
          docker run --rm -v "$PWD:/workspace:ro" ubuntu:22.04 bash -euc '
            apt-get update
            apt-get install -y --no-install-recommends \
              libegl1 libgl1 libdbus-1-3 libpulse0 \
              xvfb xauth xdotool fonts-dejavu-core
            # Unpack the download archive the way a user would: as an
            # ordinary user, without chmod. The AppImage must already run.
            useradd --create-home tester
            runuser -u tester -- tar -xzf /workspace/dist/LumiSync-x86_64.AppImage.tar.gz -C /home/tester
            runuser -u tester -- test -x /home/tester/LumiSync-x86_64.AppImage \
              || { echo "The AppImage in the tar.gz is not executable." >&2; exit 1; }
            cmp /workspace/dist/LumiSync-x86_64.AppImage /home/tester/LumiSync-x86_64.AppImage
            echo "Starting Xvfb and the packaged GUI test"
            timeout --kill-after=5s 120s xvfb-run -a bash /workspace/tools/smoke_test_appimage.sh \
              /home/tester/LumiSync-x86_64.AppImage
          '

      - name: Generate checksums
        # Per-platform name: the Windows workflow attaches its own manifest
        # to the same release, and one shared name would overwrite the other.
        run: |
          cd dist
          sha256sum LumiSync-x86_64.AppImage LumiSync-x86_64.AppImage.tar.gz \
            > LumiSync-Linux-SHA256SUMS.txt

      # In-app updates only replace an AppImage whose checksum manifest is
      # signed with a key pinned in lumisync/update_keys.py. The signed
      # message binds the release tag, normalised as the updater does.
      - name: Check update signing is configured
        if: github.event_name == 'release'
        run: |
          count="$(build/linux/venv/bin/python -c 'from lumisync.update_keys import UPDATE_PUBLIC_KEYS; print(len(UPDATE_PUBLIC_KEYS))')"
          if [ "${count:-0}" -lt 1 ]; then
            echo "No update signing public key is pinned in lumisync/update_keys.py. Run tools/update_signing.py keygen --write-public and commit the key before releasing." >&2
            exit 1
          fi

      - name: Sign the update checksum manifest
        if: github.event_name == 'release'
        env:
          LUMISYNC_UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -z "${LUMISYNC_UPDATE_SIGNING_KEY// /}" ]; then
            echo "The UPDATE_SIGNING_KEY repository secret is empty or missing, so the release cannot be signed. Set it with: gh secret set UPDATE_SIGNING_KEY < PATH" >&2
            exit 1
          fi
          build/linux/venv/bin/python tools/update_signing.py sign \
            --manifest dist/LumiSync-Linux-SHA256SUMS.txt \
            --version "$RELEASE_TAG"

      - name: Verify the update signature against the pinned keys
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          build/linux/venv/bin/python tools/update_signing.py verify \
            --manifest dist/LumiSync-Linux-SHA256SUMS.txt \
            --signature dist/LumiSync-Linux-SHA256SUMS.txt.sig \
            --version "$RELEASE_TAG" \
            || { echo "The signature does not verify with the keys pinned in lumisync/update_keys.py. Check that UPDATE_SIGNING_KEY matches a pinned public key." >&2; exit 1; }

      - name: Upload workflow artifact
        # The artifact zip drops the executable bit, so it carries only the
        # tar.gz, which keeps it. Check it with: sha256sum -c --ignore-missing
        uses: actions/upload-artifact@v7
        with:
          name: LumiSync-Linux-x86_64-AppImage
          path: |
            dist/LumiSync-x86_64.AppImage.tar.gz
            dist/LumiSync-Linux-SHA256SUMS.txt

      - name: Attach artifact to GitHub Release
        # The raw AppImage stays for the website link and AppImage tools; a
        # browser download of it still needs chmod +x, the tar.gz does not.
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          files: |
            dist/LumiSync-x86_64.AppImage
            dist/LumiSync-x86_64.AppImage.tar.gz
            dist/LumiSync-Linux-SHA256SUMS.txt
            dist/LumiSync-Linux-SHA256SUMS.txt.sig
