name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Branch pushes and their PRs would otherwise each trigger a full run; skip
# the pull_request duplicate for branches in this repo (forks still run).
jobs:
  lint:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dev tools
        run: uv sync --frozen --group dev

      - name: Ruff check
        run: uv run --frozen --group dev ruff check lumisync tests

  typecheck:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --frozen --group dev

      - name: Pyright (basic)
        run: uv run --frozen --group dev pyright

  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    # Windows matches the release build environment; Linux guards the
    # cross-platform paths (Qt runs offscreen on both). Exercise every Python
    # version the package claims to support.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    # A hung test used to burn the whole job budget. Keep a hard ceiling so a
    # stalled run fails in minutes instead of sitting for 25+ minutes.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libpulse0

      - name: Install locked package
        run: uv sync --frozen --no-dev

      - name: Run unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run --frozen --no-dev python -m unittest discover -s tests -t . -v
