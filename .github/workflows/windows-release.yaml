name: Build Windows Release

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    # A hung test or build step must not hold the runner for GitHub's 6-hour
    # default; a clean release build normally finishes well inside this.
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows artifacts
        shell: pwsh
        run: .\tools\build_windows.ps1 -Clean -RunTests -PythonVersion "3.13"

      - name: Smoke-test the Windows installer
        shell: pwsh
        run: |
          $testDir = Join-Path $env:RUNNER_TEMP "LumiSync-install-test"
          $install = Start-Process -FilePath "dist\LumiSync-Setup.exe" `
            -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$testDir") `
            -PassThru -Wait
          if ($install.ExitCode -ne 0) {
            throw "Installer failed with exit code $($install.ExitCode)"
          }
          $check = Start-Process -FilePath (Join-Path $testDir "LumiSync.exe") `
            -ArgumentList "--check-gui" -PassThru -Wait
          if ($check.ExitCode -ne 0) {
            throw "Installed app failed its GUI check with exit code $($check.ExitCode)"
          }
          $uninstall = Start-Process -FilePath (Join-Path $testDir "unins000.exe") `
            -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") `
            -PassThru -Wait
          if ($uninstall.ExitCode -ne 0) {
            throw "Uninstaller failed with exit code $($uninstall.ExitCode)"
          }

      # In-app updates only install a release whose checksum manifest is signed
      # with a key pinned in lumisync/update_keys.py (tools/update_signing.py).
      # The signed message binds the release tag, normalised the same way the
      # updater normalises the tag it reads from GitHub.
      - name: Check update signing is configured
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          $count = & .\build\windows\.venv\Scripts\python.exe -c "from lumisync.update_keys import UPDATE_PUBLIC_KEYS; print(len(UPDATE_PUBLIC_KEYS))"
          if ($LASTEXITCODE -ne 0) { throw "Could not read lumisync/update_keys.py" }
          if ([int]$count -lt 1) {
            throw "No update signing public key is pinned in lumisync/update_keys.py. Run tools/update_signing.py keygen --write-public and commit the key before releasing."
          }

      - name: Sign the update checksum manifest
        if: github.event_name == 'release'
        shell: pwsh
        env:
          LUMISYNC_UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:LUMISYNC_UPDATE_SIGNING_KEY)) {
            throw "The UPDATE_SIGNING_KEY repository secret is empty or missing, so the release cannot be signed. Set it with: gh secret set UPDATE_SIGNING_KEY < PATH"
          }
          & .\build\windows\.venv\Scripts\python.exe tools\update_signing.py sign `
            --manifest dist\LumiSync-Windows-SHA256SUMS.txt `
            --version $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { throw "Signing the checksum manifest failed" }

      - name: Verify the update signature against the pinned keys
        if: github.event_name == 'release'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          & .\build\windows\.venv\Scripts\python.exe tools\update_signing.py verify `
            --manifest dist\LumiSync-Windows-SHA256SUMS.txt `
            --signature dist\LumiSync-Windows-SHA256SUMS.txt.sig `
            --version $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) {
            throw "The signature does not verify with the keys pinned in lumisync/update_keys.py. Check that UPDATE_SIGNING_KEY matches a pinned public key."
          }

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: LumiSync-Windows-x64
          path: |
            dist/LumiSync-Setup.exe
            dist/LumiSync-Windows-SHA256SUMS.txt

      - name: Attach artifacts to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          files: |
            dist/LumiSync-Setup.exe
            dist/LumiSync-Windows-SHA256SUMS.txt
            dist/LumiSync-Windows-SHA256SUMS.txt.sig
